name: namarca
services:
  app:
    build: .
    init: true
    env_file: .env.local
    environment:
      NODE_ENV: development
      BETTER_AUTH_URL: http://admin.localhost:3000
      PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      # Signed before sending to the browser; never rewrite a signed hostname.
      S3_UPLOAD_ENDPOINT: ${S3_UPLOAD_ENDPOINT:-http://localhost:9000}
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
    command: sh -c 'npm ci --no-audit --no-fund && npm run dev -- --port 3000'
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
      pixgo-mock: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  postgres:
    image: postgres:17.6-bookworm
    env_file: .env.local
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.48
    env_file: .env.local
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        printf '{"identities":[{"name":"local-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed mini -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3.port=9000 -s3.config=/tmp/s3.json -bucket="$$S3_BUCKET" -master.telemetry=false -webdav=false -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0
    ports: ['127.0.0.1:9000:9000']
    volumes: [s3:/data]
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/$$S3_BUCKET)" = 403 && curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" http://localhost:9000/$$S3_BUCKET >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 30
  pixgo-mock:
    image: node:24.11.1-bookworm-slim
    init: true
    working_dir: /app
    env_file: .env.local
    environment:
      PIXGO_MOCK_DATA: /data/payments.json
    command: ['node', 'services/pixgo-mock/server.mjs']
    volumes:
      - ./services/pixgo-mock:/app/services/pixgo-mock:ro
      - pixgo:/data
    ports: ['127.0.0.1:4010:4010']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres:
  s3:
  pixgo:
  node_modules:
  next:
