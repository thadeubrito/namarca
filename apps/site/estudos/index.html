<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Estudos de movimento — Namarca</title>
  <link rel="stylesheet" href="/estudos/estudos.css">
  <script src="/estudos/estudos.js" defer></script>
</head>
<body>
  <header><a href="/">← Voltar ao protótipo</a><span>Namarca / Estudos</span></header>
  <main>
    <h1>Duas formas de explorar.</h1>
    <p><a href="/estudos/molduras/">Molduras em arco →</a> · <a href="/estudos/perspectiva/">Molduras em perspectiva →</a></p>
    <div class="studies">
      <section aria-labelledby="stack-title">
        <div class="section-heading"><h2 id="stack-title">Stack</h2><span>01</span></div>
        <div class="stage stack" tabindex="0" role="group" aria-label="Stack: três cartões. Use as setas ou arraste na horizontal." data-active="0">
          <div class="card tone-a" data-card="0"></div><div class="card tone-b" data-card="1"></div><div class="card tone-c" data-card="2"></div>
        </div>
        <div class="controls"><p>Arraste para explorar</p><button type="button" data-next="stack" aria-label="Próximo cartão do Stack">→</button></div>
        <p class="sr-only" aria-live="polite" id="stack-status">Cartão 1 de 3</p>
      </section>
      <section aria-labelledby="gallery-title">
        <div class="section-heading"><h2 id="gallery-title">Circular Gallery</h2><span>02</span></div>
        <div class="stage gallery" tabindex="0" role="group" aria-label="Circular Gallery: três cartões em faixa circular. Use as setas ou arraste na horizontal." data-active="0">
          <div class="track" aria-hidden="true"><div class="card tone-c"></div><div class="card tone-a"></div><div class="card tone-b"></div></div>
        </div>
        <div class="controls"><p>Arraste para explorar</p><div><button type="button" data-prev="gallery" aria-label="Cartão anterior da Circular Gallery">←</button><button type="button" data-next="gallery" aria-label="Próximo cartão da Circular Gallery">→</button></div></div>
        <p class="sr-only" aria-live="polite" id="gallery-status">Cartão 1 de 3</p>
      </section>
    </div>
  </main>
  <footer>Adaptações de movimento de <a href="https://reactbits.dev/components/stack" rel="noreferrer">React Bits</a> · <a href="/estudos/NOTICE.txt">Fontes e licença</a></footer>
</body>
</html>
