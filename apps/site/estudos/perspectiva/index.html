<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Molduras em perspectiva — Namarca</title>
  <link rel="stylesheet" href="/estudos/perspectiva/perspectiva.css">
  <script src="/estudos/perspectiva/perspectiva.js" defer></script>
</head>
<body>
  <header><a href="/estudos/">← Estudos</a><span>Namarca / 04</span></header>
  <main>
    <h1>Molduras em perspectiva</h1>
    <p class="instruction">Deslize para trocar.</p>
    <div class="scene" data-perspective tabindex="0" role="group" aria-label="Três molduras em perspectiva com espaços de foto adaptativos. Deslize na horizontal ou use as setas." data-active="0" data-settled="true">
      <div class="photo-canvas"><div class="photo" role="img" aria-label="Espaço reservado para foto"></div></div>
      <div class="track" aria-hidden="true"></div>
    </div>
    <div class="controls"><button type="button" data-step="-1" aria-label="Moldura anterior">←</button><span aria-hidden="true" class="counter">01 / 03</span><button type="button" data-step="1" aria-label="Próxima moldura">→</button><button type="button" class="autoplay" aria-pressed="false">Pausar</button></div>
    <p class="sr-only" role="status">Moldura 1 de 3</p>
  </main>
  <footer><a href="/estudos/molduras/">Comparar com molduras em arco →</a></footer>
</body>
</html>
