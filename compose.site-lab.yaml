name: namarca-site-lab
services:
  site-lab:
    image: node:24.11.1-bookworm-slim
    init: true
    working_dir: /app
    command: ['node', 'apps/site-lab/serve.mjs']
    ports: ['127.0.0.1:3002:3002']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./apps/site-lab:/app/apps/site-lab:ro
